{{ define "main" }}
<div class="page-title"><h1>Projects</h1><p class="page-lead">Funded and collaborative projects led by CILab members.</p></div>
<section class="section"><div class="card-grid cols-2">{{ range site.Data.projects }}<article class="card"><div class="project-meta"><span class="chip {{ if eq .status "Active" }}chip-active{{ end }}">{{ .status }}</span>{{ with .period }}<span class="project-period">{{ . }}</span>{{ end }}</div><h2>{{ .title }}</h2><p>{{ .description }}</p>{{ with .lead }}<p class="project-lead">Scientific lead: <strong>{{ . }}</strong></p>{{ end }}</article>{{ end }}</div></section>
{{ end }}
