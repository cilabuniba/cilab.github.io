<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/" aria-label="CILab home">
      <img src="/images/cilab-logo-blue.svg" alt="CILab" class="brand-logo on-light" width="64" height="40">
      <img src="/images/cilab-logo-white.svg" alt="" class="brand-logo on-dark" width="64" height="40" aria-hidden="true">
      <span class="brand-text"><strong>CILab</strong><small>Computational Intelligence Laboratory</small></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      {{ range site.Menus.main }}<a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active" aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch theme"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>
