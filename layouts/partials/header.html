<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/" aria-label="CILab home">
      <img src="/images/cilab-logo-blue.svg" alt="CILab" class="brand-logo">
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
    <nav class="site-nav" aria-label="Main navigation">
      {{ range site.Menus.main }}<a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a>{{ end }}
    </nav>
  </div>
</header>
