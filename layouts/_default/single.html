{{ define "main" }}
<div class="page-title"><h1>{{ .Title }}</h1>{{ if eq .Section "news" }}<p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>{{ end }}</div>
<article class="prose">{{ .Content }}{{ if or (eq .Section "news") (eq .Section "research") }}<p class="back"><a class="text-link" href="/{{ .Section }}/">← All {{ .Section }}</a></p>{{ end }}</article>
{{ end }}
