<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="theme-color" content="#345995">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · CILab{{ end }}</title>
  <link rel="icon" href="/images/cilab-logo-blue.svg" type="image/svg+xml">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <script defer src="/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="content"><div class="shell">{{ block "main" . }}{{ end }}</div></main>
  {{ partial "footer.html" . }}
</body>
</html>
