<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <meta name="theme-color" content="#345995">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · CILab{{ end }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23345995'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-weight='800' font-size='15' text-anchor='middle' fill='white'%3ECI%3C/text%3E%3C/svg%3E">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
  <script defer src="/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="content">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>
</html>
